name: 每日源自动更新

on:
  schedule:
    # 每天 UTC 07:37 = 北京时间 15:37 = 美东凌晨 02:37(冬令时)
    # 选非整点分钟 37 避开整点高峰(官方明确整点高负载); UTC 07 为美国深夜, Actions 负载低谷
    # 原先的 UTC 00:00 是全天最拥堵时刻, 曾被延迟 5-6 小时甚至直接跳过
    - cron: '37 7 * * *'
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write

jobs:
  update-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 短效源（央视频签发 / 聚盒聚合 / webview）不在每日流水线中刷新，
      # 避免扫描浪费时间与误选短效线路；仅稳定源每日更新。

      - name: 安装依赖
        run: pip install requests

      - name: "[点播] 抓取聚合站链接 + 收集 + 直连复测 + 构建"
        id: vod
        continue-on-error: true
        run: bash scripts/update_all.sh

      - name: "[直播] 下载直播源 + 测活 + 频道探测 + 构建"
        id: live
        continue-on-error: true
        run: bash scripts/update_live.sh

      - name: 检查订阅文件非空（双保险）
        run: |
          python3 - <<'PY'
          import os, sys
          required = [
            'subscriptions/tvbox.json',        # 点播主订阅
            'subscriptions/tvbox_fast.json',
            'subscriptions/by_source.json',
            'subscriptions/iptv_own.json',     # 直播稳定源订阅
            'subscriptions/iptv_own.m3u',
            'subscriptions/live_unstable.json', # 短效源备用订阅(按需刷新)
            'subscriptions/ntv_all.m3u',       # nTv 插件清单(仅 nTv 用)
          ]
          bad = []
          for f in required:
            if not os.path.exists(f) or os.path.getsize(f) < 40:
              bad.append(f)
          if bad:
            print('以下订阅文件缺失或为空:', bad)
            print('（脚本内置 last_good 回退应已处理；若仍为空请检查日志）')
          else:
            print('所有订阅文件存在且非空 ✓')
          PY

      - name: 提交变更
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: 自动更新点播+直播源 $(date '+%Y-%m-%d')"
            git push
            echo "pushed=true" >> $GITHUB_OUTPUT
          else
            echo "无变更"
            echo "pushed=false" >> $GITHUB_OUTPUT
          fi

      - name: "[CDN] 推送后刷新 jsDelivr 缓存(订阅立即生效)"
        if: steps.commit.outputs.pushed == 'true'
        continue-on-error: true
        run: python3 scripts/purge_jsdelivr.py
